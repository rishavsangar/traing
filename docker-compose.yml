version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: house_price_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./house_prices.db
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: house_price_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
